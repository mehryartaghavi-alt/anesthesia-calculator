<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anesthesia Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        /* ================= HEADER ================= */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            color: #17324d;
        }

        .header p {
            margin-top: 8px;
            color: #667085;
            font-size: 15px;
        }

        /* ================= CARD ================= */

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #17324d;
        }

        .card-subtitle {
            color: #7a8699;
            font-size: 14px;
            margin-bottom: 22px;
        }

        /* ================= PATIENT FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 48px;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 16px;
            background: white;
            color: #1f2937;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            padding-right: 55px;
        }

        .unit {
            position: absolute;
            right: 14px;
            top: 15px;
            color: #7a8699;
            font-size: 13px;
        }

        /* ================= CALCULATED VALUES ================= */

      .results-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 22px;
}

        .result-box {
            background: #f7f9fc;
            border: 1px solid #e3e8ef;
            border-radius: 12px;
            padding: 15px;
        }

        .result-label {
            display: block;
            color: #7a8699;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 18px;
            font-weight: bold;
            color: #17324d;
        }

        /* ================= MODULES ================= */

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .module-button {
            min-height: 105px;
            border: 1px solid #dce3eb;
            border-radius: 14px;
            background: #ffffff;
            padding: 18px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .module-button:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);
        }

        .module-icon {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .module-title {
            font-size: 16px;
            font-weight: bold;
            color: #17324d;
        }

        .module-description {
            margin-top: 5px;
            font-size: 12px;
            color: #7a8699;
            line-height: 1.4;
        }

        /* ================= FOOTER ================= */

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #8a94a6;
            font-size: 12px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 650px) {

            .container {
                padding: 20px 14px 40px;
            }

            .header h1 {
                font-size: 27px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .modules-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <h1>Anesthesia Calculator</h1>

        <p>
            Clinical calculation tools for anesthesiology
        </p>

    </header>


    <!-- ================= PATIENT PROFILE ================= -->

    <section class="card">

        <div class="card-title">
            Patient Profile
        </div>

        <div class="card-subtitle">
            Enter patient information used by the anesthesia calculators.
        </div>


        <div class="form-grid">

            <!-- AGE -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <div class="input-wrapper">

                    <input
                        type="number"
                        id="age"
                        min="0"
                        max="120"
                        placeholder="e.g. 58"
                    >

                    <span class="unit">
                        yr
                    </span>

                </div>

            </div>


            <!-- SEX -->

            <div class="form-group">

                <label for="sex">
                    Sex
                </label>

                <select id="sex">

                    <option value="">
                        Select
                    </option>

                    <option value="male">
                        Male
                    </option>

                    <option value="female">
                        Female
                    </option>

                </select>

            </div>


            <!-- WEIGHT -->

            <div class="form-group">

                <label for="weight">
                    Weight
                </label>

                <div class="input-wrapper">

                    <input
                        type="number"
                        id="weight"
                        min="0"
                        max="500"
                        step="0.1"
                        placeholder="e.g. 72"
                    >

                    <span class="unit">
                        kg
                    </span>

                </div>

            </div>


            <!-- HEIGHT -->

            <div class="form-group">

                <label for="height">
                    Height
                </label>

                <div class="input-wrapper">

                    <input
                        type="number"
                        id="height"
                        min="0"
                        max="250"
                        step="0.1"
                        placeholder="e.g. 175"
                    >

                    <span class="unit">
                        cm
                    </span>

                </div>

            </div>

        </div>


        <!-- ================= AUTOMATIC CALCULATIONS ================= -->

        <div class="results-grid">

            <div class="result-box">

                <span class="result-label">
                    BMI
                </span>

                <span
                    class="result-value"
                    id="bmi"
                >
                    —
                </span>

            </div>


            <div class="result-box">

                <span class="result-label">
                    IBW
                </span>

                <span
                    class="result-value"
                    id="ibw"
                >
                    —
                </span>

            </div>


            <div class="result-box">

                <span class="result-label">
                    PBW
                </span>

                <span
                    class="result-value"
                    id="pbw"
                >
                    —
                </span>

            </div>


            <div class="result-box">

                <span class="result-label">
                    BSA
                </span>

                <span
                    class="result-value"
                    id="bsa"
                >
                    —
                </span>

            </div>

        </div>

    </section>



    <!-- ================= CALCULATOR MODULES ================= -->

    <section class="card">

        <div class="card-title">
            Anesthesia Calculators
        </div>

        <div class="card-subtitle">
            Select a calculation module.
        </div>


        <div class="modules-grid">


            <!-- DRUGS -->

            <button
                class="module-button"
                type="button"
                data-module="drugs"
            >

                <div class="module-icon">
                    💉
                </div>

                <div class="module-title">
                    Drug Dosing
                </div>

                <div class="module-description">
                    Induction drugs, opioids, muscle relaxants,
                    infusions and vasoactive drugs.
                </div>

            </button>


            <!-- VENTILATOR -->

            <button
                class="module-button"
                type="button"
                data-module="ventilator"
            >

                <div class="module-icon">
                    🫁
                </div>

                <div class="module-title">
                    Ventilator
                </div>

                <div class="module-description">
                    PBW, tidal volume, minute ventilation,
                    respiratory calculations and oxygenation.
                </div>

            </button>


            <!-- FLUID -->

            <button
                class="module-button"
                type="button"
                data-module="fluids"
            >

                <div class="module-icon">
                    💧
                </div>

                <div class="module-title">
                    Fluids & Blood
                </div>

                <div class="module-description">
                    Maintenance fluid, deficit, MABL,
                    blood loss and transfusion calculations.
                </div>

            </button>


            <!-- ACID BASE -->

            <button
                class="module-button"
                type="button"
                data-module="acidbase"
            >

                <div class="module-icon">
                    🧪
                </div>

                <div class="module-title">
                    Acid–Base
                </div>

                <div class="module-description">
                    Anion gap, compensation, Winter's formula,
                    osmolar gap and ABG calculations.
                </div>

            </button>


            <!-- HEMODYNAMICS -->

            <button
                class="module-button"
                type="button"
                data-module="hemodynamics"
            >

                <div class="module-icon">
                    ❤️
                </div>

                <div class="module-title">
                    Hemodynamics
                </div>

                <div class="module-description">
                    MAP, cardiac output, cardiac index,
                    SVR, PVR and related calculations.
                </div>

            </button>


            <!-- REGIONAL -->

            <button
                class="module-button"
                type="button"
                data-module="regional"
            >

                <div class="module-icon">
                    💉
                </div>

                <div class="module-title">
                    Regional Anesthesia
                </div>

                <div class="module-description">
                    Maximum local anesthetic doses and
                    toxicity safety calculations.
                </div>

            </button>


            <!-- PEDIATRIC -->

            <button
                class="module-button"
                type="button"
                data-module="pediatric"
            >

                <div class="module-icon">
                    👶
                </div>

                <div class="module-title">
                    Pediatric
                </div>

                <div class="module-description">
                    Pediatric drug doses, fluids,
                    airway and resuscitation calculations.
                </div>

            </button>


            <!-- EMERGENCY -->

            <button
                class="module-button"
                type="button"
                data-module="emergency"
            >

                <div class="module-icon">
                    🚑
                </div>

                <div class="module-title">
                    Emergency & CPR
                </div>

                <div class="module-description">
                    Resuscitation drugs, defibrillation,
                    cardioversion and emergency calculations.
                </div>

            </button>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <div class="footer">

        Mehryar Taghavi, MD – Anesthesiology

    </div>

</div>



<script>

    /* =========================================================
       PATIENT CALCULATIONS
    ========================================================= */

    const ageInput = document.getElementById("age");
    const sexInput = document.getElementById("sex");
    const weightInput = document.getElementById("weight");
    const heightInput = document.getElementById("height");


    function calculatePatientValues() {

        const weight = parseFloat(weightInput.value);
        const height = parseFloat(heightInput.value);
        const sex = sexInput.value;


        /* ---------- Reset ---------- */

        document.getElementById("bmi").textContent = "—";
        document.getElementById("ibw").textContent = "—";
        document.getElementById("pbw").textContent = "—";
        document.getElementById("bsa").textContent = "—";


        if (
            !Number.isFinite(weight) ||
            !Number.isFinite(height) ||
            weight <= 0 ||
            height <= 0
        ) {
            return;
        }


        /* ---------- BMI ---------- */

        const heightMeters = height / 100;

        const bmi =
            weight /
            (heightMeters * heightMeters);


        document.getElementById("bmi").textContent =
            bmi.toFixed(1);


        /* ---------- BSA ---------- */

        const bsa =
            Math.sqrt(
                (height * weight) / 3600
            );


        document.getElementById("bsa").textContent =
            bsa.toFixed(2) + " m²";


        /* ---------- IBW / PBW ---------- */

        if (sex === "male") {

            const ibw =
                50 +
                2.3 *
                Math.max(
                    0,
                    (height - 152.4) / 2.54
                );


            const pbw =
                50 +
                0.91 *
                (height - 152.4);


            document.getElementById("ibw").textContent =
                ibw.toFixed(1) + " kg";


            document.getElementById("pbw").textContent =
                pbw.toFixed(1) + " kg";

        }


        if (sex === "female") {

            const ibw =
                45.5 +
                2.3 *
                Math.max(
                    0,
                    (height - 152.4) / 2.54
                );


            const pbw =
                45.5 +
                0.91 *
                (height - 152.4);


            document.getElementById("ibw").textContent =
                ibw.toFixed(1) + " kg";


            document.getElementById("pbw").textContent =
                pbw.toFixed(1) + " kg";

        }

    }


    /* =========================================================
       INPUT EVENTS
    ========================================================= */

    ageInput.addEventListener(
        "input",
        calculatePatientValues
    );

    sexInput.addEventListener(
        "change",
        calculatePatientValues
    );

    weightInput.addEventListener(
        "input",
        calculatePatientValues
    );

    heightInput.addEventListener(
        "input",
        calculatePatientValues
    );


    /* =========================================================
       MODULE BUTTONS
    ========================================================= */

    const moduleButtons =
        document.querySelectorAll(".module-button");


    moduleButtons.forEach(button => {

        button.addEventListener("click", () => {

            const module =
                button.dataset.module;


            /*
             * صفحات واقعی را بعداً اینجا وصل می‌کنیم.
             */

            console.log(
                "Selected module:",
                module
            );

        });

    });

</script>

</body>
</html>
