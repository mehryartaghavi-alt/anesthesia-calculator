<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anesthesia Calculator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

/* =========================
   HEADER
========================= */

.header {
    background: #17365d;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    margin: 8px 0 0;
    font-size: 15px;
    opacity: 0.9;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 18px;
}

/* =========================
   CARD
========================= */

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 21px;
    color: #17365d;
}

/* =========================
   PATIENT INPUTS
========================= */

.patient-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.input-group {
    display: flex;
    flex-direction: column;
}

.input-group label {
    font-weight: bold;
    margin-bottom: 7px;
    font-size: 14px;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd5e0;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

.input-group input:focus,
.input-group select:focus {
    outline: none;
    border-color: #17365d;
}

/* =========================
   CALCULATE BUTTON
========================= */

.calculate-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #17365d;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.calculate-btn:hover {
    background: #102945;
}

/* =========================
   RESULTS
========================= */

.results-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.result-box {
    background: #f5f8fc;
    border: 1px solid #dce4ee;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
}

.result-title {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 7px;
}

.result-value {
    font-size: 22px;
    font-weight: bold;
    color: #17365d;
}

/* =========================
   CALCULATOR MODULES
========================= */

.module-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.module-btn {
    border: none;
    border-radius: 10px;
    padding: 17px 10px;
    background: #eaf0f7;
    color: #17365d;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.module-btn:hover {
    background: #d8e4f1;
    transform: translateY(-1px);
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    padding: 10px 20px 30px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .header h1 {
        font-size: 25px;
    }

    .container {
        margin-top: 20px;
    }

    .card {
        padding: 18px;
    }

    .patient-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .results-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .module-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .module-btn {
        font-size: 14px;
        padding: 15px 5px;
    }
}

@media (max-width: 380px) {

    .patient-grid {
        grid-template-columns: 1fr;
    }

    .module-grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>Anesthesia Calculator</h1>

    <p>
        Clinical calculation tools for anesthesiology
    </p>

</div>



<div class="container">


<!-- =========================
     PATIENT PROFILE
========================= -->

<div class="card">

    <h2>Patient Profile</h2>


    <div class="patient-grid">


        <!-- AGE -->

        <div class="input-group">

            <label for="age">
                Age (years)
            </label>

            <input
                type="number"
                id="age"
                min="0"
                max="120"
                placeholder="Age"
            >

        </div>



        <!-- SEX -->

        <div class="input-group">

            <label for="sex">
                Sex
            </label>

            <select id="sex">

                <option value="">
                    Select
                </option>

                <option value="male">
                    Male
                </option>

                <option value="female">
                    Female
                </option>

            </select>

        </div>



        <!-- WEIGHT -->

        <div class="input-group">

            <label for="weight">
                Weight (kg)
            </label>

            <input
                type="number"
                id="weight"
                min="1"
                step="0.1"
                placeholder="Weight"
            >

        </div>



        <!-- HEIGHT -->

        <div class="input-group">

            <label for="height">
                Height (cm)
            </label>

            <input
                type="number"
                id="height"
                min="30"
                max="250"
                step="0.1"
                placeholder="Height"
            >

        </div>


    </div>


    <!-- CALCULATE -->

    <button
        class="calculate-btn"
        onclick="calculatePatientValues()"
    >
        Calculate
    </button>

</div>



<!-- =========================
     CALCULATED VALUES
========================= -->

<div class="card">

    <h2>Patient Calculations</h2>


    <div class="results-grid">


        <!-- BMI -->

        <div class="result-box">

            <div class="result-title">
                BMI
            </div>

            <div
                class="result-value"
                id="bmi"
            >
                —
            </div>

        </div>



        <!-- IBW -->

        <div class="result-box">

            <div class="result-title">
                IBW
            </div>

            <div
                class="result-value"
                id="ibw"
            >
                —
            </div>

        </div>



        <!-- LBW -->

        <div class="result-box">

            <div class="result-title">
                LBW
            </div>

            <div
                class="result-value"
                id="lbw"
            >
                —
            </div>

        </div>



        <!-- ADJBW -->

        <div class="result-box">

            <div class="result-title">
                AdjBW
            </div>

            <div
                class="result-value"
                id="adjbw"
            >
                —
            </div>

        </div>



        <!-- PBW -->

        <div class="result-box">

            <div class="result-title">
                PBW
            </div>

            <div
                class="result-value"
                id="pbw"
            >
                —
            </div>

        </div>



        <!-- BSA -->

        <div class="result-box">

            <div class="result-title">
                BSA
            </div>

            <div
                class="result-value"
                id="bsa"
            >
                —
            </div>

        </div>


    </div>

</div>



<!-- =========================
     CALCULATOR MODULES
========================= -->

<div class="card">

    <h2>Calculators</h2>


    <div class="module-grid">


        <button
            class="module-btn"
            onclick="openDrugDose()"
        >
            💊 Drug Dosing
        </button>



        <button
            class="module-btn"
            onclick="openVentilator()"
        >
            🫁 Ventilator
        </button>



        <button
            class="module-btn"
            onclick="openFluid()"
        >
            💧 Fluids & Blood
        </button>



        <button
            class="module-btn"
            onclick="openAcidBase()"
        >
            ⚗️ Acid–Base
        </button>



        <button
            class="module-btn"
            onclick="openHemodynamics()"
        >
            ❤️ Hemodynamics
        </button>



        <button
            class="module-btn"
            onclick="openRegional()"
        >
            💉 Regional Anesthesia
        </button>



        <button
            class="module-btn"
            onclick="openPediatric()"
        >
            👶 Pediatric
        </button>



        <button
            class="module-btn"
            onclick="openEmergency()"
        >
            🚨 Emergency & CPR
        </button>


    </div>

</div>


</div>



<!-- =========================
     FOOTER
========================= -->

<div class="footer">

    Mehryar Taghavi, MD – Anesthesiology

</div>



<script>

/* =====================================================
   CALCULATE PATIENT VALUES
===================================================== */

function calculatePatientValues() {


    /* -------------------------
       GET INPUTS
    ------------------------- */

    const age =
        parseFloat(
            document.getElementById("age").value
        );

    const sex =
        document.getElementById("sex").value;

    const weight =
        parseFloat(
            document.getElementById("weight").value
        );

    const height =
        parseFloat(
            document.getElementById("height").value
        );


    /* -------------------------
       BASIC VALIDATION
    ------------------------- */

    if (!weight || !height || !sex) {

        alert(
            "Please enter Sex, Weight and Height."
        );

        return;
    }


    /* =================================================
       BMI
    ================================================= */

    const heightMeter =
        height / 100;

    const bmi =
        weight /
        (heightMeter * heightMeter);


    /* =================================================
       IBW
       Devine Formula
    ================================================= */

    let ibw;

    if (sex === "male") {

        ibw =
            50 +
            2.3 *
            Math.max(
                0,
                (height - 152.4) / 2.54
            );

    } else {

        ibw =
            45.5 +
            2.3 *
            Math.max(
                0,
                (height - 152.4) / 2.54
            );

    }


    /* =================================================
       PBW
       ARDSNet Formula
    ================================================= */

    let pbw;

    if (sex === "male") {

        pbw =
            50 +
            0.91 *
            (height - 152.4);

    } else {

        pbw =
            45.5 +
            0.91 *
            (height - 152.4);

    }


    /* =================================================
       LBW
       Janmahasatian Formula
    ================================================= */

    let lbw;

    if (sex === "male") {

        lbw =
            (9270 * weight) /
            (6680 + (216 * bmi));

    } else {

        lbw =
            (9270 * weight) /
            (8780 + (244 * bmi));

    }


    /* =================================================
       AdjBW
    ================================================= */

    const adjbw =
        ibw +
        0.4 *
        (weight - ibw);


    /* =================================================
       BSA
       Mosteller Formula
    ================================================= */

    const bsa =
        Math.sqrt(
            (height * weight) / 3600
        );


    /* =================================================
       DISPLAY RESULTS
    ================================================= */

    document.getElementById("bmi").innerText =
        bmi.toFixed(1);

    document.getElementById("ibw").innerText =
        ibw.toFixed(1) + " kg";

    document.getElementById("lbw").innerText =
        lbw.toFixed(1) + " kg";

    document.getElementById("adjbw").innerText =
        adjbw.toFixed(1) + " kg";

    document.getElementById("pbw").innerText =
        pbw.toFixed(1) + " kg";

    document.getElementById("bsa").innerText =
        bsa.toFixed(2) + " m²";


    /* =================================================
       SAVE PATIENT DATA
       Temporary session only
    ================================================= */

    const patientData = {

        age: age || null,

        sex: sex,

        weight: weight,

        height: height,

        bmi: Number(
            bmi.toFixed(1)
        ),

        ibw: Number(
            ibw.toFixed(1)
        ),

        lbw: Number(
            lbw.toFixed(1)
        ),

        adjbw: Number(
            adjbw.toFixed(1)
        ),

        pbw: Number(
            pbw.toFixed(1)
        ),

        bsa: Number(
            bsa.toFixed(2)
        )

    };


    sessionStorage.setItem(
        "patientData",
        JSON.stringify(patientData)
    );


    console.log(
        "Patient data saved:",
        patientData
    );

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function openDrugDose() {

    calculatePatientValues();

    window.location.href =
        "drug-dose.html";

}


function openVentilator() {

    calculatePatientValues();

    window.location.href =
        "ventilator.html";

}


function openFluid() {

    calculatePatientValues();

    window.location.href =
        "fluid.html";

}


function openAcidBase() {

    calculatePatientValues();

    window.location.href =
        "acid-base.html";

}


function openHemodynamics() {

    calculatePatientValues();

    window.location.href =
        "hemodynamics.html";

}


function openRegional() {

    calculatePatientValues();

    window.location.href =
        "regional.html";

}


function openPediatric() {

    calculatePatientValues();

    window.location.href =
        "pediatric.html";

}


function openEmergency() {

    calculatePatientValues();

    window.location.href =
        "emergency.html";

}

</script>


</body>
</html>
