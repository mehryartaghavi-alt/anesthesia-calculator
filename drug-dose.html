<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Drug Dosing - Anesthesia Calculator</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7fb;
    color:#1f2937;

}


.container{

    max-width:850px;
    margin:auto;
    padding:25px 18px;

}


/* Header */

.header{

    text-align:center;
    margin-bottom:25px;

}


.header h1{

    color:#17324d;
    margin-bottom:5px;

}


.header p{

    color:#6b7280;

}



/* Card */

.card{

    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);

}


.title{

    font-size:20px;
    font-weight:bold;
    color:#17324d;
    margin-bottom:15px;

}



/* Patient */

.patient-grid{

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;

}


.patient-box{

    background:#f7f9fc;
    padding:12px;
    border-radius:10px;
    text-align:center;

}


.patient-box small{

    display:block;
    color:#777;
    font-size:12px;

}


.patient-box strong{

    font-size:17px;

}



/* Form */

.form-group{

    margin-bottom:15px;

}


label{

    display:block;
    font-weight:bold;
    margin-bottom:7px;

}


select,input{

    width:100%;
    height:45px;
    border-radius:10px;
    border:1px solid #d5dce5;
    padding:0 12px;
    font-size:16px;

}



/* Result */

.result{

    background:#eef6ff;
    border-radius:15px;
    padding:20px;
    text-align:center;
    margin-top:20px;

}


.result h2{

    margin:5px;
    color:#17324d;

}


.result span{

    font-size:28px;
    font-weight:bold;

}



/* Buttons */

button{

    width:100%;
    height:48px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;

}


button:hover{

    background:#1d4ed8;

}



@media(max-width:600px){

.patient-grid{

grid-template-columns:repeat(2,1fr);

}

}


</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>
💉 Drug Dosing
</h1>

<p>
Anesthesia Calculator
</p>

</div>



<!-- Patient Summary -->

<div class="card">


<div class="title">
Patient Profile
</div>


<div class="patient-grid">


<div class="patient-box">

<small>Weight</small>

<strong id="weight">
72 kg
</strong>

</div>



<div class="patient-box">

<small>IBW</small>

<strong id="ibw">
70 kg
</strong>

</div>



<div class="patient-box">

<small>LBW</small>

<strong id="lbw">
60 kg
</strong>

</div>



<div class="patient-box">

<small>Age</small>

<strong id="age">
58 yr
</strong>

</div>



</div>


</div>





<!-- Drug Selection -->


<div class="card">


<div class="title">
Drug Selection
</div>



<div class="form-group">

<label>
Drug Category
</label>


<select id="category">

<option>
Induction
</option>

<option>
Opioids
</option>

<option>
Muscle Relaxants
</option>

<option>
Sedation
</option>

<option>
Vasopressors
</option>


</select>

</div>





<div class="form-group">

<label>
Drug
</label>


<select id="drug">


<option value="propofol">
Propofol
</option>


<option value="fentanyl">
Fentanyl
</option>


<option value="rocuronium">
Rocuronium
</option>


<option value="midazolam">
Midazolam
</option>


<option value="norepinephrine">
Norepinephrine
</option>


</select>


</div>



<div class="form-group">

<label>
Dose Weight Basis
</label>


<select id="weightType">


<option value="tbw">
Total Body Weight
</option>


<option value="ibw">
Ideal Body Weight
</option>


<option value="lbw">
Lean Body Weight
</option>


</select>


</div>



<div class="form-group">

<label>
Dose (mg/kg)
</label>


<input

id="dose"

type="number"

value="2"

step="0.1"

/>


</div>



<button onclick="calculateDose()">

Calculate Dose

</button>



<div class="result">


<h2>
Calculated Dose
</h2>


<span id="result">

144 mg

</span>


</div>



</div>





</div>





<script>


/*

Temporary patient data

Later connected to index.html

*/


let patient={

weight:72,

ibw:70,

lbw:60

};





function calculateDose(){


let drugWeight;


let type =
document.getElementById("weightType").value;



if(type==="tbw")

drugWeight=patient.weight;


if(type==="ibw")

drugWeight=patient.ibw;


if(type==="lbw")

drugWeight=patient.lbw;



let dose =
parseFloat(
document.getElementById("dose").value
);



let result =
drugWeight*dose;



document.getElementById("result")
.innerHTML =
result.toFixed(1)+" mg";



}



</script>



</body>

</html>
